<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Карман">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0D121D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Карман</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: сводка «Всего в кармане» сверху, ниже карточки-разделы; на ПК вкладки в шапке, на телефоне нижняя панель как в приложении */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --fg:#141A28; --muted:#5D6679; --line:#DCE1EA;
  --accent:#3346D3; --accent-soft:#E4E8FC; --on-accent:#FFFFFF; --coin:#F6BE42;
  --good:#11805B; --good-soft:#DDF3EA; --warn:#9A5C00; --warn-soft:#FBEFD9; --bad:#BF3328; --bad-soft:#FBE3E0;
  --b1:#4C6FFF; --b2:#E0703A; --b3:#1F9A82; --b4:#A956C2; --b5:#C2921A; --b6:#4A8FBF; --b7:#C84E6E; --b8:#7C8597;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121D; --surface:#151C2B; --surface-2:#1B2335; --fg:#E7EBF3; --muted:#9AA3B8; --line:#2A3348;
  --accent:#8592FF; --accent-soft:#222A50; --on-accent:#0D121D; --coin:#F2B93E;
  --good:#43C893; --good-soft:#163628; --warn:#EBA845; --warn-soft:#3A2C14; --bad:#F2716A; --bad-soft:#3D1B1A;
  --b1:#7B93FF; --b2:#F08A55; --b3:#3CC0A4; --b4:#C67BDC; --b5:#E0B43C; --b6:#6DAEDB; --b7:#E57391; --b8:#97A0B2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D121D; --surface:#151C2B; --surface-2:#1B2335; --fg:#E7EBF3; --muted:#9AA3B8; --line:#2A3348;
  --accent:#8592FF; --accent-soft:#222A50; --on-accent:#0D121D; --coin:#F2B93E;
  --good:#43C893; --good-soft:#163628; --warn:#EBA845; --warn-soft:#3A2C14; --bad:#F2716A; --bad-soft:#3D1B1A;
  --b1:#7B93FF; --b2:#F08A55; --b3:#3CC0A4; --b4:#C67BDC; --b5:#E0B43C; --b6:#6DAEDB; --b7:#E57391; --b8:#97A0B2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in,.main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted)}
.brand-mark{width:32px;height:32px;flex:none;display:block}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 11px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab svg{width:18px;height:18px;flex:none}
.top-actions{display:flex;align-items:center;gap:8px}
.sync-when{font-size:12px;color:var(--muted);white-space:nowrap}

.main{padding-block:20px 40px;display:grid;gap:16px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:14px}
.banner.bad{background:var(--bad-soft)} .banner.warn{background:var(--warn-soft)} .banner.good{background:var(--good-soft)}
.banner .grow{flex:1 1 220px;min-width:0}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:860px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:end}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.net{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.01em;margin:6px 0 4px}
.big{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.1;margin:0 0 10px}
.net-note{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--surface-2);border-radius:12px;padding:12px;min-width:0}
.stat .v{font-weight:700;font-size:18px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
@media (max-width:420px){.stat .v{font-size:15px}.stat{padding:10px}}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.compo{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:14px;gap:2px}
.compo span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .main-t{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.right{text-align:right}
.bank-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.bank-mark.sm{width:26px;height:26px;border-radius:8px;font-size:10px}
.bank-group + .bank-group{margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.bank-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bank-h .t{font-weight:700;flex:1}
.acc{display:flex;justify-content:space-between;gap:10px;padding:6px 0 6px 44px;font-size:14px}
.acc .n{color:var(--muted);min-width:0;overflow-wrap:anywhere}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter > span{display:block;height:100%;border-radius:5px;background:var(--accent)}

.due-list{display:grid;gap:10px}
.due{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2)}
.due .t{font-weight:700;overflow-wrap:anywhere}
.due .s{font-size:13px;color:var(--muted)}
.due.bad{background:var(--bad-soft)} .due.warn{background:var(--warn-soft)}

.field{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:90px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none;flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-current="page"]{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px} .good-t{color:var(--good)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;text-align:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

/* сверка */
.chk{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(110px,150px);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .t{font-weight:600;overflow-wrap:anywhere}
.chk .s{font-size:12px;color:var(--muted)}
.chk input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;width:100%;text-align:right;color:var(--fg)}
.chk input.changed{border-color:var(--accent);background:var(--accent-soft)}
.chk-sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 2px}
.chk-sec:first-child{margin-top:0}
.sticky-save{position:sticky;bottom:12px;display:flex;justify-content:flex-end;margin-top:12px}

/* операции */
.ops-filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.op{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.op .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.op .s{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.op select{border:0;background:var(--surface-2);border-radius:8px;padding:3px 6px;font-size:12px;color:var(--muted);max-width:180px}
.op .amt{font-weight:700;white-space:nowrap;text-align:right}
.day-h{font-size:12px;font-weight:700;color:var(--muted);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.cat-bars{display:grid;gap:8px}
.cat-bars .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}

/* кешбэк */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--fg)}
.best{display:grid;gap:8px;margin-top:12px}
.best-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.best-item:first-child{background:var(--accent-soft)}
.best-item .pct{font-family:var(--font-display);font-weight:600;font-size:18px;min-width:56px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 6px 5px 10px;border-radius:999px;background:var(--surface-2);border:0;color:var(--fg)}
button.chip{padding:6px 12px;cursor:pointer}
button.chip:hover{background:var(--accent-soft)}
.chip b{font-weight:700}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.chip .x:hover{background:var(--line);color:var(--fg)}
.cb-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cb-card:first-child{border-top:0}

/* цели */
.goals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.goal .t{font-weight:700;overflow-wrap:anywhere}
.goal .s{font-size:13px;color:var(--muted)}
.goal .fc{grid-column:1/-1;font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ring text{font-family:var(--font-display);font-weight:600}

.chart-wrap{overflow-x:auto}
.chart{width:100%;min-width:460px;height:auto;display:block}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}

.dep{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px}
.dep + .dep{margin-top:10px}
.dep-top{display:flex;gap:12px;align-items:center}
.dep-top .t{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:8px}
.kv .l{font-size:12px;color:var(--muted)} .kv .v{font-weight:700}

.acc-edit{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:10px}
.acc-edit:first-child{border-top:0}
.acc-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.acc-line .t{font-weight:600;flex:1;min-width:140px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;flex:1;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{background:transparent}
  .top-actions{margin-left:auto}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .sync-when{display:none}
  .chk{grid-template-columns:auto minmax(0,1fr) 120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#overview" aria-label="Карман, обзор">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><rect x="6.5" y="6.5" width="10" height="7" rx="1.6" fill="#40C4AA" transform="rotate(-12 11.5 10)"/><circle cx="19" cy="11" r="6" fill="var(--coin)"/><path d="M6 15.5h20v9.2L16 28.6 6 24.7z" fill="var(--surface)"/><path d="M8 18.2h16M8.6 18.2v5.6l7.4 2.9 7.4-2.9v-5.6" fill="none" stroke="var(--accent)" stroke-width="1.1" stroke-dasharray="1.8 1.4"/></svg>
      <span>Карман<small id="modeLabel">Пример данных</small></span>
    </a>
    <nav class="tabs" aria-label="Разделы">
      <a class="tab" href="#overview" data-v="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Обзор</a>
      <a class="tab" href="#check" data-v="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Сверка</a>
      <a class="tab" href="#ops" data-v="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>Операции</a>
      <a class="tab" href="#cashback" data-v="cashback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>Кешбэк</a>
      <a class="tab" href="#goals" data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Цели</a>
    </nav>

<script>
/* ---------- разбор выписок (справок о движении средств) ---------- */
/* Вход: pages = [ [ {s, x, y}, ... ] строки страницы ], meta = {CreationDate} */
function groupLines(items){
  items = items.filter(i => i.s && i.s.trim()).sort((a,b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for(const it of items){
    const last = lines[lines.length-1];
    if(last && Math.abs(last.y - it.y) < 2.5) last.items.push(it);
    else lines.push({y: it.y, items: [it]});
  }
  for(const l of lines){ l.items.sort((a,b) => a.x - b.x); l.text = l.items.map(i => i.s).join(" ").replace(/\s+/g," ").trim(); }
  return lines;
}
function parseNum(s){
  s = String(s).replace(/[^\d,.\-+]/g, "");
  if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g,"").replace(",", ".");
  else s = s.replace(/,/g, "");
  return parseFloat(s);
}
function ruDate(d, t){ const [dd,mm,yy] = d.split("."); return yy+"-"+mm+"-"+dd+"T"+(t || "00:00").slice(0,5); }
function pdfDate(s){
  const m = /D:(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)/.exec(s || "");
  return m ? m[1]+"-"+m[2]+"-"+m[3]+"T"+m[4]+":"+m[5] : null;
}

function parseStatement(pages, meta){
  const all = pages.flat();
  const full = all.map(l => l.text).join("\n");
  const res = { bank:null, format:null, contract:null, product:null, balance:null, period:null, ops:[], totals:null, warnings:[] };
  if(/ТБАНК|ТБанк|TBANK/i.test(full)) res.bank = "Т-Банк";
  else if(/АЛЬФА|Альфа-Банк|alfabank/i.test(full)) res.bank = "Альфа-Банк";
  else if(/СБЕРБАНК|Сбербанк|ПАО Сбер/i.test(full)) res.bank = "Сбер";
  let m;
  if((m = /Номер договора:\s*(\d+)/.exec(full))) res.contract = m[1];
  if((m = /Продукт:\s*([^\n]+)/.exec(full))) res.product = m[1].trim();
  if((m = /за период с (\d\d\.\d\d\.\d{4}) по (\d\d\.\d\d\.\d{4})/.exec(full))) res.period = { from: ruDate(m[1]).slice(0,10), to: ruDate(m[2]).slice(0,10) };
  const created = pdfDate(meta && meta.CreationDate);
  if((m = /Сумма доступного остатка на (\d\d\.\d\d\.\d{4}):\s*([-\d\s.,]+)/.exec(full))){
    const day = ruDate(m[1]).slice(0,10);
    res.balance = { at: created && created.slice(0,10) === day ? created : day + "T23:59", amount: parseNum(m[2]) };
  }
  const tin = /Пополнения:\s*([\d\s.,]+)/.exec(full), tout = /Расходы:\s*([\d\s.,]+)/.exec(full);
  if(tin && tout) res.totals = { in: parseNum(tin[1]), out: parseNum(tout[1]) };

  if(res.bank !== "Т-Банк"){ res.warnings.push("Пока я умею читать только выписки Т-Банка. Пришлите пример выписки этого банка, и я добавлю его."); return res; }

  const isDeposit = /Дата и время операции/.test(full) && /Сумма в рублях/.test(full);
  res.format = isDeposit ? "deposit" : "card";

  if(isDeposit){
    const re = /^(\d\d\.\d\d\.\d{4}) (\d\d:\d\d)(?::\d\d)?\s+([\d\s]+[.,]\d\d)\s*([A-Z]{3})\s+([\d\s]+[.,]\d\d)\s*RUB\s+(.+)$/;
    for(const l of all){
      const r = re.exec(l.text); if(!r) continue;
      const desc = r[6].trim();
      const out = /сняти|выплат|закрыт|списан|перевод с вклада|возврат вклада|изъят/i.test(desc) && !/процент/i.test(desc);
      res.ops.push({ at: ruDate(r[1], r[2]), amount: (out ? -1 : 1) * parseNum(r[5]), desc, card:"" });
    }
  } else {
    let cols = null, cur = null;
    const flush = () => { if(cur){ cur.desc = cur.desc.replace(/\s+/g," ").trim(); res.ops.push(cur); } cur = null; };
    for(const page of pages){
      cols = null;
      for(const l of page){
        const hdr = l.items.find(i => /^Дата и время/.test(i.s));
        if(hdr){
          flush();
          const fx = re => { const it = l.items.find(i => re.test(i.s.trim())); return it ? it.x : null; };
          const c = [fx(/^Дата и время/), fx(/^Дата$/), fx(/^Сумма в валюте/), fx(/^Сумма операции/), fx(/^Описание/), fx(/^Номер/)];
          if(c.every(v => v != null)) cols = c;
          continue;
        }
        if(!cols) continue;
        if(/^(операции|списания)\b/.test(l.text) && l.items[0].x < cols[1]) continue;
        if(/ТБанк» универсальная|БИК \d|^Пополнения:|^Расходы:|^С уважением/.test(l.text)){ flush(); continue; }
        const cell = ["","","","","",""];
        for(const it of l.items){ let k = 0; for(let j = 0; j < 6; j++) if(it.x >= cols[j] - 6) k = j; cell[k] += (cell[k] ? " " : "") + it.s; }
        if(/^\d\d\.\d\d\.\d{4}$/.test(cell[0].trim())){
          flush();
          const amt = parseNum(cell[3] || cell[2]);
          cur = { at: ruDate(cell[0].trim()), amount: amt, desc: cell[4], card: cell[5].replace(/[^\d]/g,"") };
          if(isNaN(amt)) res.warnings.push("Не разобрал сумму в строке от " + cell[0]);
        } else if(cur){
          if(/^\d\d:\d\d$/.test(cell[0].trim()) && cur.at.endsWith("T00:00")) cur.at = cur.at.slice(0,11) + cell[0].trim();
          if(cell[4]) cur.desc += " " + cell[4];
        }
      }
      flush();
    }
  }
  // контроль по итогам выписки
  if(res.totals){
    const pin = res.ops.filter(o => o.amount > 0).reduce((s,o) => s + o.amount, 0);
    const pout = -res.ops.filter(o => o.amount < 0).reduce((s,o) => s + o.amount, 0);
    res.check = { in: Math.round(pin*100)/100, out: Math.round(pout*100)/100, ok: Math.abs(pin - res.totals.in) < 0.05 && Math.abs(pout - res.totals.out) < 0.05 };
  }
  return res;
}

async function pdfToPages(pdfjsLib, buf){
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let meta = {};
  try{ meta = (await pdf.getMetadata()).info || {}; }catch(e){}
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    pages.push(groupLines(tc.items.map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5] }))));
  }
  return { pages, meta };
}

if(typeof module !== "undefined") module.exports = { parseStatement, pdfToPages, groupLines, parseNum };

  ["Образование", /SKILLBOX|НЕТОЛОГ|NETOLOGY|STEPIK|COURSERA|УНИВЕРСИТ|МГТУ|ШКОЛА|SCHOOL|KNIG|КНИГ|LITRES|ЛИТРЕС/i]
];
function guessCategory(d){ for(const [c, rx] of CAT_RX) if(rx.test(d)) return c; return null; }
function merchantKey(d){
  const ph = /\+7\d{10}/.exec(d); if(ph) return ph[0];
  let k = String(d).replace(/^(оплата услуг|оплата в|операция в|покупка|внешний банковский перевод|внешний перевод|перевод)\s*/i, "");
  k = k.replace(/\b(MOSCOW|MOSKVA|MOSKOW|MOSCOW RUS|SAINT-PETERSB\w*|TROICZK|G MOSKVA)\b.*$/i, "").replace(/\s+RUS?$/i, "");
  k = k.replace(/[-_*#]?\d{3,}\S*/g, "").replace(/\s+/g, " ").trim().toUpperCase().slice(0, 40);
  return k || String(d).toUpperCase().slice(0, 40);
}

const EMPTY = () => ({ accounts:[], balances:[], ops:[], cashback:[], goals:[], rules:[], settings:[] });
const S = {
  api: LS.get(K.api, null), db: EMPTY(), demo: true, model: null,

async function api(body){
  const r = await fetch(S.api.url, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key:S.api.key }, body)) });
  if(!r.ok) throw new Error("http_" + r.status);
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
function normalize(db){
  const out = EMPTY();
  for(const k of Object.keys(out)) out[k] = (db && db[k] ? db[k] : []).map(r => Object.assign({}, r));
  for(const a of out.accounts){ a.limit = num(a.limit); a.graceDays = num(a.graceDays); a.rate = num(a.rate); a.daily = a.daily === true || a.daily === "1" || a.daily === 1 ? 1 : 0; a.archived = a.archived === true || a.archived === "1" || a.archived === 1 ? 1 : 0; }
  for(const b of out.balances) b.amount = num(b.amount) || 0;
  for(const o of out.ops) o.amount = num(o.amount) || 0;
  for(const c of out.cashback) c.pct = num(c.pct) || 0;
  for(const g of out.goals){ g.target = num(g.target) || 0; g.manual = num(g.manual); }
  return out;
}
const toRow = r => { const o = {}; for(const k in r) o[k] = r[k] == null ? "" : r[k]; return o; };
function localUpsert(sheet, rows){
  const list = S.db[sheet]; const idx = new Map(list.map((r,i) => [r.id, i]));
  for(const r of rows){ if(idx.has(r.id)) list[idx.get(r.id)] = r; else { idx.set(r.id, list.length); list.push(r); } }
}
function save(sheet, rows){
  rows = [].concat(rows); if(!rows.length) return;
  localUpsert(sheet, rows);
  if(!S.demo){ S.queue.push({ op:"upsert", sheet, rows: rows.map(toRow) }); persist(); flush(); }
  recompute();
}
function removeRows(sheet, ids){
  ids = [].concat(ids); const del = new Set(ids);
  S.db[sheet] = S.db[sheet].filter(r => !del.has(r.id));
  if(!S.demo){ S.queue.push({ op:"remove", sheet, ids }); persist(); flush(); }
  recompute();
}
function persist(){ if(S.demo) return; LS.set(K.cache, S.db); LS.set(K.queue, S.queue); }
let flushing = false;
async function flush(){
  if(S.demo || !S.api || flushing || !S.queue.length) return;
  flushing = true; renderChrome();
  try{
    while(S.queue.length){
      const items = S.queue.slice(0, 20);
      await api({ action:"batch", items });
      S.queue.splice(0, items.length); LS.set(K.queue, S.queue);
    }
    S.error = null;
  }catch(e){ S.error = errKind(e); }
  flushing = false; renderChrome();
}
function errKind(e){ const m = String(e && e.message || e); return m === "bad_key" ? "key" : /http_|Failed to fetch|NetworkError|Load failed|TypeError/i.test(m) ? "network" : "other"; }
async function load(){
  if(!S.api){ S.demo = true; S.db = demoDb(); recompute(); return; }
  S.demo = false;
  const cached = LS.get(K.cache, null);
  if(cached){ S.db = normalize(cached); recompute(); }
  S.syncing = true; renderChrome();
  try{
    await flush();
    const j = await api({ action:"read" });
    S.db = normalize(j.data);
    for(const q of S.queue){ if(q.op === "upsert") localUpsert(q.sheet, q.rows.map(r => normalize({[q.sheet]:[r]})[q.sheet][0])); }
    S.synced = Date.now(); LS.set(K.synced, S.synced); persist(); S.error = null;
  }catch(e){ S.error = errKind(e); }
  S.syncing = false; recompute();
}
const setting = id => { const r = S.db.settings.find(x => x.id === id); return r ? r.value : null; };
const setSetting = (id, value) => save("settings", [{ id, value: String(value) }]);

/* ================= классификация операций ================= */
function classify(o){
  const d = o.desc || "", a = o.amount;
  if(o.kind){ return { kind:o.kind, category:o.category || (o.kind === "transfer" ? OWN : a < 0 ? "Прочее" : "Поступления") }; }
  const key = merchantKey(d);
  const rule = S.db.rules.find(r => r.key && (r.key === key || d.toUpperCase().includes(r.key)));
  if(rule) return { kind: rule.kind || (rule.category === OWN ? "transfer" : a < 0 ? "expense" : "income"), category: rule.category };
  if(/кубышк/i.test(d)) return { kind:"transfer", category:"Кубышка" };
  if(/к[эе]шб[эе]к|cash ?back/i.test(d)) return { kind:"cashback", category:"Кешбэк" };
  if(/процент|капитализац/i.test(d) && a > 0) return { kind:"interest", category:"Проценты" };
  if(/^(плата за|комисси)|штраф|пени\b/i.test(d) && a < 0) return { kind:"fee", category:"Платные услуги банка" };
  if(/в других кредитных организациях|финуслуг|погашение кредит|погашение задолженност/i.test(d)) return { kind:"transfer", category:OWN };
  if(/перевод себе|внутренний перевод|внутрибанковский перевод|перевод с договора|перевод на договор|между своими|пополнение вклада|первичное пополнение|закрытие вклада|выплата вклада|перевод с вклада/i.test(d)) return { kind:"transfer", category:OWN };
  if(/внесение наличных|снятие наличных|банкомат|atm/i.test(d)) return { kind:"transfer", category:"Наличные" };
  if(a > 0){
    if(/возврат/i.test(d)) return { kind:"refund", category: guessCategory(d) || "Возвраты" };
    if(/компенсац|за приглашение|бонус|вознагражд/i.test(d)) return { kind:"income", category:"Бонусы и компенсации" };
    if(/зарплат|аванс|заработн|оплата труда/i.test(d)) return { kind:"income", category:"Зарплата" };
    return { kind:"income", category:"Поступления" };
  }
  if(/внешний перевод|внешний банковский|перевод по номеру|перевод клиенту|перевод на карту|по номеру телефона/i.test(d)) return { kind:"expense", category:"Переводы людям" };
  return { kind:"expense", category: guessCategory(d) || "Прочее" };
}

/* ================= модель ================= */
function recompute(){ S.model = buildModel(); render(); }
function buildModel(){
  const db = S.db, today = ymd(new Date()), now = isoNow(), year = today.slice(0,4), curM = today.slice(0,7);
  const accAll = new Map(db.accounts.map(a => [a.id, a]));
  const accounts = db.accounts.filter(a => !a.archived);
  const snaps = {}, opsBy = {};
  for(const b of db.balances){ (snaps[b.accountId] = snaps[b.accountId] || []).push(b); }
  for(const k in snaps) snaps[k].sort((x,y) => x.at.localeCompare(y.at));
  const ops = db.ops.filter(o => accAll.has(o.accountId)).map(o => Object.assign({}, o, classify(o), { acc: accAll.get(o.accountId) }));
  for(const o of ops){ (opsBy[o.accountId] = opsBy[o.accountId] || []).push(o); }
  for(const k in opsBy) opsBy[k].sort((x,y) => x.at.localeCompare(y.at));
  // переводы между банками: «Поступления» и «Переводы людям» одной суммы в разных счетах в пределах 2 дней
  const inc = ops.filter(o => o.kind === "income" && o.category === "Поступления" && !o.kindLocked);
  const byAmt = new Map(); for(const o of inc){ const k = Math.round(o.amount*100); (byAmt.get(k) || byAmt.set(k, []).get(k)).push(o); }
  for(const o of ops){
    if(o.kind !== "expense" || o.category !== "Переводы людям") continue;
    const list = byAmt.get(Math.round(-o.amount*100)); if(!list) continue;
    const t = parseD(o.at).getTime();
    const m = list.find(x => !x._used && x.accountId !== o.accountId && Math.abs(parseD(x.at).getTime() - t) <= 2*864e5);
    if(m && !db.rules.some(r => r.key === merchantKey(o.desc))){ m._used = true; o.kind = m.kind = "transfer"; o.category = m.category = OWN; }
  }

  const balanceAt = (id, t) => {
    const sn = snaps[id] || [], os = opsBy[id] || [];
    if(!sn.length) return null;
    let base = null; for(const s of sn){ if(s.at <= t) base = s; else break; }
    if(base){ let v = base.amount; for(const o of os) if(o.at > base.at && o.at <= t) v += o.amount; return v; }
    let v = sn[0].amount; for(const o of os) if(o.at > t && o.at <= sn[0].at) v -= o.amount; return v;
  };
  const lastAt = id => { const sn = snaps[id] || [], os = opsBy[id] || []; const a = sn.length ? sn[sn.length-1].at : "", b = os.length ? os[os.length-1].at : ""; return a > b ? a : b || null; };

  const accs = accounts.map(a => {
    const t = TYPES[a.type] || TYPES.debit;
    const bal = balanceAt(a.id, "9999");
    return Object.assign({}, a, { group:t.group, typeLabel:t.label, bal, known: bal != null, updated: lastAt(a.id), lastSnap: (snaps[a.id]||[]).slice(-1)[0] || null });
  });
  const totals = { money:0, savings:0, debt:0 };
  for(const a of accs){
    if(!a.known) continue;
    if(a.group === "debt") totals.debt += Math.max(-a.bal, 0);
    else if(a.bal < 0) totals.debt += -a.bal;
    else if(a.group === "savings") totals.savings += a.bal; else totals.money += a.bal;
  }
  totals.net = totals.money + totals.savings - totals.debt;

  // сроки
  const dues = [];
  for(const a of accs){
    if(!a.known) continue;
    const debt = Math.max(-a.bal, 0);
    if(a.type === "overdraft" && debt > 0.5){
      const draws = (opsBy[a.id] || []).filter(o => o.amount < 0).slice().reverse();
      let left = debt; const open = [];
      for(const d of draws){ if(left <= 0.5) break; const part = Math.min(-d.amount, left); open.push({ date:d.at.slice(0,10), amount:part }); left -= part; }
      const grace = a.graceDays || 7;
      if(open.length && left < 1){
        const byDate = {}; for(const o of open){ const fee = addDays(o.date, grace); byDate[fee] = (byDate[fee] || 0) + o.amount; }
        for(const fee of Object.keys(byDate).sort()) dues.push({ acc:a, amount:byDate[fee], payBy:addDays(fee, -1), feeFrom:fee, kind:"overdraft" });
      } else if(a.dueDate) dues.push({ acc:a, amount:debt, payBy:a.dueDate, kind:"overdraft" });
      else dues.push({ acc:a, amount:debt, payBy:null, kind:"overdraft" });
    }
    if((a.type === "credit" || a.type === "loan") && debt > 0.5) dues.push({ acc:a, amount:debt, payBy:a.dueDate || null, kind:a.type });
    if((a.type === "deposit") && a.endDate && daysTo(a.endDate) >= 0 && daysTo(a.endDate) <= 45) dues.push({ acc:a, amount:a.bal, payBy:a.endDate, kind:"depositEnd" });
  }
  for(const d of dues){
    d.days = d.payBy ? daysTo(d.payBy) : null;
    d.status = d.kind === "depositEnd" ? "accent" : d.days == null ? "muted" : d.days < 0 ? "bad" : d.days <= 3 ? "bad" : d.days <= 10 ? "warn" : "good";
  }
  dues.sort((x,y) => (x.days == null) - (y.days == null) || (x.days||0) - (y.days||0));

  // вклады и налог
  const deps = accs.filter(a => (a.type === "deposit" || a.type === "savings")).map(a => {
    const r = (a.rate || 0) / 100, bal = a.known ? Math.max(a.bal, 0) : 0;
    const interestYear = (opsBy[a.id] || []).filter(o => o.kind === "interest" && o.at.slice(0,4) === year).reduce((s,o) => s + o.amount, 0);
    const growth = (to) => { if(!r || !bal) return 0; const days = Math.max(daysTo(to), 0); if(a.capitalization === "monthly") return bal * (Math.pow(1 + r/12, days/30.42) - 1); return bal * r * days / 365; };
    const endOrYear = a.endDate && a.endDate < year+"-12-31" ? a.endDate : year+"-12-31";
    return Object.assign({}, a, { interestYear, toEnd: a.endDate ? growth(a.endDate) : null, restYear: growth(endOrYear), daysLeft: a.endDate ? daysTo(a.endDate) : null });
  });
  const keyRate = num(setting("keyRate-"+year)) ?? (year === "2026" ? 16 : null);
  const extra = num(setting("interestExtra-"+year)) || 0;
  const received = deps.reduce((s,d) => s + d.interestYear, 0) + extra;
  const restYear = deps.reduce((s,d) => s + d.restYear, 0);
  const limit = keyRate != null ? 1e6 * keyRate / 100 : null;
  const tax = { year, keyRate, limit, received, extra, restYear, total: received + restYear, ndfl: limit != null ? Math.max(0, received + restYear - limit) * 0.13 : null };

  // кешбэк
  const months = []; { const d = new Date(); for(let i = 5; i >= 0; i--) months.push(ym(new Date(d.getFullYear(), d.getMonth()-i, 1))); }
  const cbBy = {}; months.forEach(m => cbBy[m] = {});
  let cbYear = 0; const cbYearBank = {}; const cbList = [];
  for(const o of ops){
    if(o.kind !== "cashback") continue;
    const m = o.at.slice(0,7), bank = o.acc.bank;
    if(cbBy[m]) cbBy[m][bank] = (cbBy[m][bank] || 0) + o.amount;
    if(o.at.slice(0,4) === year){ cbYear += o.amount; cbYearBank[bank] = (cbYearBank[bank] || 0) + o.amount; }
    cbList.push(o);
  }
  cbList.sort((a,b) => b.at.localeCompare(a.at));

  // месяц
  const monthStats = m => {
    let income = 0, spend = 0; const cats = {};
    for(const o of ops){
      if(o.at.slice(0,7) !== m) continue;
      if(o.kind === "income") income += o.amount;
      else if(o.kind === "expense" || o.kind === "fee"){ spend += -o.amount; cats[o.category] = (cats[o.category] || 0) - o.amount; }
      else if(o.kind === "refund"){ spend -= o.amount; cats[o.category] = (cats[o.category] || 0) - o.amount; }
    }
    return { income, spend, cats: Object.entries(cats).filter(c => c[1] > 0.5).sort((a,b) => b[1]-a[1]) };
  };

  // история капитала по неделям
  const hist = [];
  const tracked = accs.filter(a => a.known);
  if(tracked.length){
    const d = new Date(); d.setHours(23,59,0,0);
    for(let i = 25; i >= 0; i--){
      const t = new Date(d); t.setDate(t.getDate() - i*7);
      const ts = ymd(t)+"T23:59";
      let v = 0; for(const a of tracked){ const b = balanceAt(a.id, ts); if(b != null) v += b; }
      hist.push({ t: ymd(t), v });
    }
  }

  // цели
  const accById = new Map(accs.map(a => [a.id, a]));
  const ago90 = ymd(new Date(Date.now() - 90*864e5)) + "T23:59";
  const goals = db.goals.map(g => {
    const ids = String(g.accountIds || "").split(",").filter(id => accById.has(id));
    const current = ids.length ? ids.reduce((s,id) => s + Math.max(accById.get(id).bal || 0, 0), 0) : (g.manual || 0);
    const past = ids.length ? ids.reduce((s,id) => s + Math.max(balanceAt(id, ago90) || 0, 0), 0) : null;
    const pace = ids.length && past != null ? (current - past) / 3 : null;
    const target = g.target || 0, remaining = Math.max(target - current, 0), pct = target > 0 ? Math.min(current/target, 1) : 0;
    let eta = null; if(remaining > 0 && pace > 0){ const e = new Date(); e.setMonth(e.getMonth() + Math.ceil(remaining/pace), 1); eta = ymd(e); }
    let need = null, monthsLeft = null;
    if(g.deadline){ const dl = parseD(g.deadline), n = new Date(); monthsLeft = (dl.getFullYear()-n.getFullYear())*12 + dl.getMonth()-n.getMonth(); if(monthsLeft >= 1) need = remaining / monthsLeft; }
    let status = "muted"; if(remaining <= 0) status = "good"; else if(g.deadline && eta) status = eta <= g.deadline ? "good" : "warn"; else if(g.deadline) status = "warn";
    return Object.assign({}, g, { ids, current, target, remaining, pct, pace, eta, need, monthsLeft, status });
  });

  const opsMonths = Array.from(new Set(ops.map(o => o.at.slice(0,7)))).sort().reverse();
  return { today, now, year, curM, accs, accById, totals, dues, deps, tax, months, cbBy, cbYear, cbYearBank, cbList, monthStats, hist, goals, ops, opsMonths, balanceAt };
}

function ring(pct, size, status){
  const r = size/2 - 7, c = 2*Math.PI*r, off = c*(1-pct);
  const col = status === "good" ? "var(--good)" : status === "warn" ? "var(--warn)" : "var(--accent)";
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+Math.round(pct*100)+'%"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="9"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="'+(size/5.2)+'" fill="var(--fg)">'+Math.round(pct*100)+'%</text></svg>';
}
function dueRow(d){
  const a = d.acc;
  let title, sub;
  if(d.kind === "overdraft"){ title = a.name + ": вернуть " + money2(d.amount); sub = d.payBy ? "до " + dLong(d.payBy) + " включительно" + (d.feeFrom ? ", с " + dLong(d.feeFrom) + " начнётся плата" : "") : "срок неизвестен: загрузите выписку карты или укажите дату в настройке счёта"; }
  else if(d.kind === "depositEnd"){ title = a.name + " закрывается"; sub = dLong(d.payBy) + " · решите, куда переложить деньги"; }
  else { title = a.name + ": внести " + money2(d.amount); sub = d.payBy ? "до " + dLong(d.payBy) : "дата платежа не указана: добавьте её в настройке счёта"; }
  const pill = d.days == null ? "" : '<span class="pill '+d.status+'">'+esc(cap(inDays(d.days)))+'</span>';
  return '<div class="due '+(d.status === "bad" ? "bad" : d.status === "warn" ? "warn" : "")+'">'+bankMark(a.bank)+'<div style="min-width:0"><div class="t num">'+esc(title)+'</div><div class="s">'+esc(sub)+'</div></div>'+pill+'</div>';
}
function lineChart(points){
  if(points.length < 2) return "";
  const W = 640, H = 200, L = 64, R = 34, T = 14, B = 26;
  const vs = points.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if(hi - lo < 1){ hi += 1000; lo -= 1000; }
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1,2,2.5,5,10].map(k => k*mag).find(s => s >= raw);
  const y0 = Math.floor(lo/step)*step, y1 = Math.ceil(hi/step)*step;
  const x = i => L + (W-L-R) * i/(points.length-1), y = v => T + (H-T-B) * (1 - (v-y0)/(y1-y0));
  let g = "";
  for(let v = y0; v <= y1 + 1e-6; v += step) g += '<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+axisMoney(v, step)+'</text>';
  const path = points.map((p,i) => (i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area = path + " L"+x(points.length-1).toFixed(1)+" "+(H-B)+" L"+L+" "+(H-B)+" Z";
  points.forEach((p,i) => { if(i % 4 === 1 || i === points.length-1){ const d = parseD(p.t); g += '<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d.getDate()+" "+MONTHS[d.getMonth()]+'</text>'; } });
  const last = points[points.length-1];
  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Капитал по неделям">'+g+
    '<path d="'+area+'" fill="var(--accent)" opacity=".1"/><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<circle cx="'+x(points.length-1).toFixed(1)+'" cy="'+y(last.v).toFixed(1)+'" r="4.5" fill="var(--accent)"/></svg></div>';
}

function bestSummary(cats){
  const byCat = {};
  for(const c of cats){ const k = c.category.toLowerCase(); if(!byCat[k] || c.pct > byCat[k].pct) byCat[k] = c; }
  return Object.values(byCat).sort((a,b) => b.pct - a.pct).slice(0,4).map(c => c.category + " — " + accName(c.accountId) + " " + c.pct + "%");
}
const accName = id => { const a = S.db.accounts.find(x => x.id === id); return a ? (a.bank === a.name ? a.bank : a.bank + " " + a.name) : "?"; };

function importCard(r, i){
  if(r.state === "loading") return '<div class="banner" style="margin-top:12px"><div class="grow">Читаю «'+esc(r.file)+'»…</div></div>';
  if(r.state === "error") return '<div class="banner bad" style="margin-top:12px"><div class="grow"><b>'+esc(r.file)+'</b>: '+esc(r.error)+'</div><button class="btn small" data-act="dismissImp" data-i="'+i+'">Скрыть</button></div>';
  if(r.state === "done") return '<div class="banner good" style="margin-top:12px"><div class="grow"><b>'+esc(r.file)+'</b> → '+esc(accName(r.accountId))+': новых операций '+r.added+', уже были '+r.dup+'.'+(r.check ? (r.check.ok ? ' Суммы сошлись с итогами выписки.' : ' Внимание: суммы не сошлись с итогами выписки, проверьте операции.') : '')+(r.kubAdded ? ' Движений Кубышки: '+r.kubAdded+'.' : '')+'</div><button class="btn small" data-act="dismissImp" data-i="'+i+'">Скрыть</button></div>';

function cbChart(M){
  const W = 640, H = 220, L = 46, R = 10, T = 12, B = 28;
  const banks = Array.from(new Set(M.months.flatMap(m => Object.keys(M.cbBy[m]))));
  const totals = M.months.map(m => Object.values(M.cbBy[m]).reduce((s,v) => s+v, 0));
  const maxV = Math.max(...totals, 1);
  const raw = maxV/4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1,2,2.5,5,10].map(k => k*mag).find(s => s >= raw), top = Math.ceil(maxV/step)*step;
  const y = v => T + (H-T-B) * (1 - v/top), bw = (W-L-R)/M.months.length, barW = Math.min(46, bw*.56);
  let g = "";
  for(let v = 0; v <= top + 1e-6; v += step) g += '<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+axisMoney(v, step)+'</text>';
  M.months.forEach((m, i) => {
    const x = L + bw*i + (bw-barW)/2; let acc = 0;
    for(const b of banks){ const v = M.cbBy[m][b] || 0; if(!v) continue; const y1 = y(acc), y2 = y(acc+v); g += '<rect x="'+x.toFixed(1)+'" y="'+y2.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(y1-y2-1,.5).toFixed(1)+'" fill="'+bankColor(b)+'" rx="2"><title>'+esc(b)+': '+money(v)+'</title></rect>'; acc += v; }
    g += '<text x="'+(x+barW/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(m===M.curM?' style="fill:var(--fg);font-weight:600"':'')+'>'+MONTHS[+m.slice(5)-1]+'</text>';
    if(totals[i] > 0) g += '<text x="'+(x+barW/2)+'" y="'+(y(totals[i])-5)+'" text-anchor="middle" style="fill:var(--fg)">'+shortMoney(totals[i])+'</text>';
  });
  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кешбэк по месяцам">'+g+'</svg></div><div class="legend">'+banks.map(b => '<span><span class="dot" style="background:'+bankColor(b)+'"></span>'+esc(b)+'</span>').join("")+'</div>';
}

  else if(g.ids.length) p.push("За последние 3 месяца сумма на этих счетах не выросла.");
  if(g.need != null) p.push('Чтобы успеть к сроку, нужно <b class="num">'+money(g.need)+'</b> в месяц.');
  return p.join(" ") || "Укажите срок, чтобы увидеть, сколько откладывать в месяц.";
}

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfReady = null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  pdfReady = new Promise((res, rej) => {
    if(window.pdfjsLib) return res(window.pdfjsLib);
    const s = document.createElement("script"); s.src = PDFJS + "pdf.min.js";
    s.onload = async () => {
      const lib = window.pdfjsLib; if(!lib) return rej(new Error("pdf.js"));
      try{ const t = await (await fetch(PDFJS + "pdf.worker.min.js")).text(); lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type:"text/javascript" })); }
      catch(e){ lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; }
      res(lib);
    };
    s.onerror = () => { pdfReady = null; rej(new Error("Не загрузился модуль чтения PDF. Проверьте интернет.")); };
    document.head.appendChild(s);
  });
  return pdfReady;
}
async function handleFiles(files){
  for(const file of files){
    const rec = { file:file.name, state:"loading" }; S.ui.imports.unshift(rec); if(S.view === "ops") render();
    try{
      if(!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") throw new Error("Это не PDF. Скачайте выписку в формате PDF.");
      const lib = await loadPdfJs();
      const { pages, meta } = await pdfToPages(lib, await file.arrayBuffer());
      const p = parseStatement(pages, meta);
      if(p.warnings.length && !p.ops.length) throw new Error(p.warnings[0]);
      if(!p.ops.length) throw new Error("Не нашёл операций в файле. Это точно справка о движении средств?");
      rec.parsed = p;
      let acc = p.contract ? S.db.accounts.find(a => a.contract && a.contract === p.contract) : null;
      if(!acc){ const cards = Array.from(new Set(p.ops.map(o => o.card).filter(Boolean))); if(cards.length === 1) acc = S.db.accounts.find(a => a.last4 && a.last4 === cards[0]); }
      if(acc) applyImport(rec, acc.id); else rec.state = "choose";
    }catch(e){ rec.state = "error"; rec.error = e.message || String(e); }
    if(S.view === "ops") render();
  }
}
function applyImport(rec, accountId){
  const p = rec.parsed, acc = S.db.accounts.find(a => a.id === accountId);
  if(p.contract && !acc.contract) save("accounts", [Object.assign({}, acc, { contract:p.contract })]);
  const seen = {}, rows = [];
  for(const o of p.ops){
    const base = accountId+"|"+o.at+"|"+o.amount.toFixed(2)+"|"+o.desc;
    seen[base] = (seen[base] || 0) + 1;
    rows.push({ id:"o-"+hash(base+"|"+seen[base]), accountId, at:o.at, amount:o.amount, desc:o.desc, card:o.card || "", kind:"", category:"", source:"statement" });
  }
  const have = new Set(S.db.ops.map(o => o.id));
  const fresh = rows.filter(r => !have.has(r.id));
  const kub = S.db.accounts.find(a => a.type === "overdraft" && a.linkedTo === accountId);
  const mirror = kub ? fresh.filter(r => /кубышк/i.test(r.desc)).map(r => Object.assign({}, r, { id:r.id+"k", accountId:kub.id, amount:-r.amount, card:"" })) : [];
  const balRows = [];
  if(p.balance && (acc.type === "debit" || acc.type === "savings" || acc.type === "cash")) balRows.push({ id:"b-"+accountId+"-"+p.balance.at, accountId, at:p.balance.at, amount:p.balance.amount, source:"statement" });
  if(p.format === "deposit" && p.ops.some(o => /первичное пополнение|открытие вклада/i.test(o.desc))){
    const last = p.ops.reduce((m,o) => o.at > m ? o.at : m, ""); balRows.push({ id:"b-"+accountId+"-"+last, accountId, at:last, amount: Math.round(p.ops.reduce((s,o) => s + o.amount, 0)*100)/100, source:"statement" });
  }
  if(fresh.length || mirror.length) save("ops", fresh.concat(mirror));
  if(balRows.length) save("balances", balRows);
  Object.assign(rec, { state:"done", accountId, added:fresh.length, dup:rows.length - fresh.length, kubAdded:mirror.length, check:p.check });
  delete rec.parsed;
  S.ui.opsMonth = null;
  render();
}

/* ================= события ================= */
function setView(v){ S.view = VIEWS.includes(v) ? v : "overview"; S.ui.confirm = null; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", () => setView(location.hash.slice(1)));

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-act], a"); if(!t) return;
  const act = t.dataset.act, ui = S.ui;
  if(t.id === "syncBtn" || act === "retry"){ load(); return; }
  if(act === "pickPdf"){ $("#fileIn").click(); return; }
  if(act === "pickJson"){ $("#jsonIn").click(); return; }
  if(act === "moreOps"){ ui.opsLimit += 200; render(); return; }
  if(act === "dismissImp"){ ui.imports.splice(+t.dataset.i, 1); render(); return; }
  if(act === "impTo"){ const r = ui.imports[+t.dataset.i]; const sel = $("#imp-acc-"+t.dataset.i); if(r && sel) applyImport(r, sel.value); return; }
  if(act === "saveCheck"){
    const at = isoNow(), rows = [];
    for(const inp of $$("[data-chk]")){
      const v = num(inp.value); if(v == null) continue;
      const a = S.db.accounts.find(x => x.id === inp.dataset.chk); if(!a) continue;
      const debt = (TYPES[a.type]||TYPES.debit).group === "debt";
      rows.push({ id:"b-"+a.id+"-"+at, accountId:a.id, at, amount: debt ? -Math.abs(v) : v, source:"manual" });
    }
    if(!rows.length){ toast("Впишите хотя бы одну сумму"); return; }
    save("balances", rows); toast("Сверка сохранена: "+rows.length+" "+plural(rows.length,"счёт","счёта","счетов")); return;
  }
  if(act === "addGoal"){ ui.editGoal = { id:null }; render(); return; }
  if(act === "cancelGoal"){ ui.editGoal = null; render(); return; }
  if(act === "cancelConfirm"){ ui.confirm = null; render(); return; }
  if(t.dataset.editgoal){ ui.editGoal = { id:t.dataset.editgoal }; render(); window.scrollTo(0,0); return; }
  if(t.dataset.askgoal){ ui.confirm = "g:"+t.dataset.askgoal; render(); return; }
  if(t.dataset.delgoal){ ui.confirm = null; removeRows("goals", t.dataset.delgoal); return; }
  if(t.dataset.delcb){ removeRows("cashback", t.dataset.delcb); return; }
  if(t.dataset.cbm){ ui.cbMonth = t.dataset.cbm; render(); return; }
  if(t.dataset.cbq){ ui.cbQuery = t.dataset.cbq; const i = $("#cbq"); if(i) i.value = ui.cbQuery; renderBest(); return; }
  if(act === "copyCb"){
    const m = ui.cbMonth || ym(new Date()); const d = parseD(m+"-01"); const prevM = ym(new Date(d.getFullYear(), d.getMonth()-1, 1));
    save("cashback", S.db.cashback.filter(c => c.month === prevM).map(c => Object.assign({}, c, { id:"c-"+uid(), month:m }))); return;
  }
  if(act === "addAcc"){ ui.editAcc = "new"; render(); return; }
  if(act === "cancelAcc"){ ui.editAcc = null; render(); return; }
  if(t.dataset.editacc){ ui.editAcc = ui.editAcc === t.dataset.editacc ? null : t.dataset.editacc; render(); return; }
  if(act === "logout"){ ui.confirm = "logout"; render(); return; }
  if(act === "logoutYes"){ LS.del(K.api); LS.del(K.cache); LS.del(K.queue); LS.del(K.synced); S.api = null; S.queue = []; S.error = null; ui.confirm = null; load(); return; }
  if(act === "backup"){
    const blob = new Blob([JSON.stringify(S.db, null, 1)], { type:"application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "karman-backup-"+ymd(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove(); return;
  }
});
document.addEventListener("keydown", e => { if((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); $("#fileIn").click(); } });
document.addEventListener("change", e => {
  const t = e.target, ui = S.ui;
  if(t.id === "fileIn"){ const f = Array.from(t.files || []); t.value = ""; if(f.length){ if(S.view !== "ops") location.hash = "ops"; handleFiles(f); } return; }
  if(t.id === "jsonIn"){ const f = t.files && t.files[0]; t.value = ""; if(f) importStart(f); return; }
  if(t.id === "f-month"){ ui.opsMonth = t.value; ui.opsLimit = 150; render(); return; }
  if(t.id === "f-acc"){ ui.opsAcc = t.value; ui.opsLimit = 150; render(); return; }
  if(t.id === "f-kind"){ ui.opsKind = t.value; ui.opsLimit = 150; render(); return; }
  if(t.dataset.opcat){
    const o = S.db.ops.find(x => x.id === t.dataset.opcat); if(!o) return;
    const key = merchantKey(o.desc), cat = t.value;
    save("rules", [{ id:"r-"+hash(key), key, category:cat, kind: cat === OWN || cat === "Наличные" ? "transfer" : (o.amount < 0 ? "expense" : "income") }]);
    toast("«"+key+"» теперь всегда в «"+cat+"»"); return;
  }
  if(t.closest("[data-accform]") && t.name === "type"){ const f = t.closest("[data-accform]"); const id = f.dataset.accform; const cur = id === "new" ? {} : S.db.accounts.find(a => a.id === id) || {}; const draft = Object.assign({}, cur, formObj(f)); f.outerHTML = accForm(Object.assign(draft, { id: cur.id })); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "cbq"){ S.ui.cbQuery = t.value; renderBest(); }
  else if(t.id === "f-q"){ S.ui.opsQ = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#f-q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }, 250); }
  else if(t.dataset.chk) t.classList.toggle("changed", t.value.trim() !== "");
});
const drop = e => { const d = e.target.closest && e.target.closest("#drop"); return d; };
document.addEventListener("dragover", e => { const d = drop(e); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = drop(e); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = drop(e); if(d){ e.preventDefault(); d.classList.remove("over"); handleFiles(Array.from(e.dataTransfer.files || [])); } });
function formObj(f){ const o = {}; for(const el of f.elements){ if(!el.name) continue; o[el.name] = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value.trim(); } return o; }

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, ui = S.ui;
  if(f.id === "apiForm"){
    const url = $("#apiUrl").value.trim(), key = $("#apiKey").value.trim(), msg = $("#apiMsg");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ msg.textContent = "Адрес должен начинаться с https://script.google.com/"; return; }
    msg.textContent = "Проверяю…"; S.api = { url, key };
    try{ await api({ action:"read" }); LS.set(K.api, S.api); S.error = null; await load(); toast("Таблица подключена"); }
    catch(err){ S.api = null; msg.textContent = errKind(err) === "key" ? "Таблица не приняла ключ. Скопируйте его из листа settings, строка apiKey." : "Не удалось связаться со скриптом. Проверьте адрес и что в развертывании указан доступ «Все»."; }
    return;
  }
  if(f.id === "taxForm"){ const y = S.model.year; setSetting("keyRate-"+y, num($("#tx-rate").value) ?? ""); setSetting("interestExtra-"+y, num($("#tx-extra").value) ?? 0); toast("Сохранено"); return; }
  if(f.dataset.cbform){
    const cat = f.cat.value.trim(), pct = num(f.pct.value); if(!cat || pct == null) return;
    save("cashback", [{ id:"c-"+uid(), month: ui.cbMonth || ym(new Date()), accountId:f.dataset.cbform, category:cat, pct }]);
    setTimeout(() => { const n = document.querySelector('[data-cbform="'+f.dataset.cbform+'"] input[name=cat]'); if(n) n.focus(); }, 0); return;
  }
  if(f.dataset.accform){
    const o = formObj(f), id = f.dataset.accform === "new" ? "a-"+uid() : f.dataset.accform;
    const cur = S.db.accounts.find(a => a.id === id) || {};
    const row = Object.assign({}, cur, o, { id, limit:num(o.limit), graceDays:num(o.graceDays), rate:num(o.rate) });
    ui.editAcc = null; save("accounts", [row]); toast("Счёт сохранён"); return;
  }
  if(f.id === "goalForm"){
    const ids = $$('input[name="gacc"]:checked', f).map(x => x.value).join(",");
    const g = { id: (ui.editGoal && ui.editGoal.id) || "g-"+uid(), name:$("#gf-name").value.trim(), target:num($("#gf-target").value) || 0, deadline:$("#gf-deadline").value || "", accountIds:ids, manual:num($("#gf-manual").value) };
    ui.editGoal = null; save("goals", [g]); return;
  }
});

async function importStart(file){
  try{
    const data = JSON.parse(await file.text());
    let n = 0;
    for(const sheet of Object.keys(EMPTY())){ if(Array.isArray(data[sheet]) && data[sheet].length){ save(sheet, normalize({ [sheet]: data[sheet] })[sheet]); n += data[sheet].length; } }
    toast("Загружено записей: " + n);
  }catch(e){ toast("Файл не прочитан: это должен быть karman-start.json"); }
}

/* ================= пример данных (выдуманные цифры) ================= */
function demoDb(){
  const t = new Date(), at = (dd, h) => { const d = new Date(t); d.setDate(d.getDate() - dd); return ymd(d)+"T"+(h || "12:00"); };
  const m = ym(t);
  const accounts = [
    { id:"d1", bank:"Т-Банк", name:"Дебетовая", type:"debit", last4:"0001", daily:1 },
    { id:"d2", bank:"Т-Банк", name:"Кубышка", type:"overdraft", limit:30000, graceDays:7, linkedTo:"d1" },
    { id:"d3", bank:"Т-Банк", name:"Кредитка", type:"credit", limit:50000, dueDate: ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate()+18)) },
    { id:"d4", bank:"Альфа-Банк", name:"Дебетовая", type:"debit", daily:1 },
    { id:"d5", bank:"Альфа-Банк", name:"Вклад", type:"deposit", rate:15, capitalization:"monthly", openDate: at(40).slice(0,10), endDate: ymd(new Date(t.getFullYear(), t.getMonth()+2, 10)) },
    { id:"d6", bank:"Сбер", name:"Накопительный", type:"savings", rate:12 },
    { id:"d7", bank:"Ozon Банк", name:"Карта", type:"debit" }
  ];
  const balances = [
    { id:"s1", accountId:"d1", at:at(0,"08:00"), amount:12400 }, { id:"s2", accountId:"d2", at:at(0,"08:00"), amount:-3850 },
    { id:"s3", accountId:"d3", at:at(0,"08:00"), amount:-21000 }, { id:"s4", accountId:"d4", at:at(0,"08:00"), amount:31800 },
    { id:"s5", accountId:"d5", at:at(0,"08:00"), amount:500000 }, { id:"s6", accountId:"d6", at:at(0,"08:00"), amount:84000 },
    { id:"s7", accountId:"d7", at:at(0,"08:00"), amount:2300 }
  ];
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const ops = []; let n = 0; const add = o => ops.push(Object.assign({ id:"x"+(n++), kind:"", category:"", card:"", source:"demo" }, o));
  const shops = [["Оплата в PYATEROCHKA",[200,1800]],["Оплата в MAGNIT",[150,1500]],["Оплата в COFFEE LIKE",[180,450]],["Оплата в YANDEX*GO TAXI",[250,900]],["Оплата в OZON",[400,4000]],["Оплата в APTEKA 36,6",[150,1200]],["Оплата услуг MTS",[400,600]],["Оплата в METRO MOSKVA",[60,60]]];
  for(let d = 170; d >= 1; d--){
    const k = 1 + Math.floor(rnd()*3);
    for(let i = 0; i < k; i++){ const [s,[lo,hi]] = shops[Math.floor(rnd()*shops.length)]; add({ accountId: rnd() < .6 ? "d1" : "d4", at:at(d, pad(9+Math.floor(rnd()*12))+":"+pad(Math.floor(rnd()*60))), amount:-Math.round(lo + rnd()*(hi-lo)), desc:s }); }
    const day = parseD(at(d)).getDate();
    if(day === 5) add({ accountId:"d4", at:at(d,"10:00"), amount:85000, desc:"Зарплата" });
    if(day === 20) add({ accountId:"d4", at:at(d,"10:00"), amount:55000, desc:"Аванс" });
    if(day === 7) add({ accountId:"d6", at:at(d,"11:00"), amount:20000, desc:"Перевод себе" });
    if(day === 7) add({ accountId:"d4", at:at(d,"11:00"), amount:-20000, desc:"Перевод себе" });
    if(day === 23){ add({ accountId:"d1", at:at(d,"22:40"), amount:Math.round(600 + rnd()*900), desc:"Кэшбэк за покупки" }); add({ accountId:"d4", at:at(d,"22:40"), amount:Math.round(400 + rnd()*700), desc:"Кешбэк по карте" }); }
    if(day === 1) add({ accountId:"d6", at:at(d,"03:00"), amount:Math.round(700 + rnd()*200), desc:"Проценты на остаток" });
  }
  add({ accountId:"d2", at:at(3,"22:05"), amount:-1850, desc:"Перевод средств из Кубышки" });
  add({ accountId:"d2", at:at(2,"22:05"), amount:-2000, desc:"Перевод средств из Кубышки" });
  // начальные остатки «до» операций, чтобы снимки сегодня оставались верными
  const cashback = [
    { id:"c1", month:m, accountId:"d1", category:"Кафе и рестораны", pct:5 }, { id:"c2", month:m, accountId:"d1", category:"Такси", pct:7 },
    { id:"c3", month:m, accountId:"d4", category:"Супермаркеты", pct:5 }, { id:"c4", month:m, accountId:"d4", category:"Аптеки", pct:5 },
    { id:"c5", month:m, accountId:"d1", category:"Всё остальное", pct:1 }, { id:"c6", month:m, accountId:"d4", category:"Всё остальное", pct:1 }
  ];
  const goals = [{ id:"g1", name:"Подушка безопасности", target:300000, deadline: ymd(new Date(t.getFullYear()+1, 5, 1)), accountIds:"d6", manual:null }, { id:"g2", name:"Отпуск", target:120000, deadline: ymd(new Date(t.getFullYear()+1, 6, 1)), accountIds:"", manual:38000 }];
  return normalize({ accounts, balances, ops, cashback, goals, rules:[], settings:[] });
}

/* ================= запуск ================= */
S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
load();
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !S.demo && S.synced && Date.now() - S.synced > 5*60*1000) load(); });
window.__karman = { S, buildModel, classify, merchantKey, parseStatement };
})();
