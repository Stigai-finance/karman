<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Карман">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D121D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Карман</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: сводка капитала сверху, ниже карточки-разделы; на ПК вкладки в шапке, на телефоне нижняя панель как в приложении */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F4F6FA; --fg:#141A28; --muted:#5D6679; --line:#DCE1EA;
  --accent:#3346D3; --accent-soft:#E4E8FC; --on-accent:#FFFFFF;
  --good:#11805B; --good-soft:#DDF3EA; --warn:#9A5C00; --warn-soft:#FBEFD9; --bad:#BF3328; --bad-soft:#FBE3E0;
  --b1:#4C6FFF; --b2:#E0703A; --b3:#1F9A82; --b4:#A956C2; --b5:#C2921A; --b6:#4A8FBF; --b7:#C84E6E; --b8:#7C8597;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121D; --surface:#151C2B; --surface-2:#1B2335; --fg:#E7EBF3; --muted:#9AA3B8; --line:#2A3348;
  --accent:#8592FF; --accent-soft:#222A50; --on-accent:#0D121D;
  --good:#43C893; --good-soft:#163628; --warn:#EBA845; --warn-soft:#3A2C14; --bad:#F2716A; --bad-soft:#3D1B1A;
  --b1:#7B93FF; --b2:#F08A55; --b3:#3CC0A4; --b4:#C67BDC; --b5:#E0B43C; --b6:#6DAEDB; --b7:#E57391; --b8:#97A0B2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D121D; --surface:#151C2B; --surface-2:#1B2335; --fg:#E7EBF3; --muted:#9AA3B8; --line:#2A3348;
  --accent:#8592FF; --accent-soft:#222A50; --on-accent:#0D121D;
  --good:#43C893; --good-soft:#163628; --warn:#EBA845; --warn-soft:#3A2C14; --bad:#F2716A; --bad-soft:#3D1B1A;
  --b1:#7B93FF; --b2:#F08A55; --b3:#3CC0A4; --b4:#C67BDC; --b5:#E0B43C; --b6:#6DAEDB; --b7:#E57391; --b8:#97A0B2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in,.main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:16px;padding-block:12px}
 .brand-mark{width:32px;height:32px;flex:none;display:block}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.tab:hover{color:var(--fg);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab svg{width:18px;height:18px;flex:none}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}

.main{padding-block:20px 40px;display:grid;gap:16px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--fg);font-size:14px}
.banner.bad{background:var(--bad-soft)}
.banner.warn{background:var(--warn-soft)}
.banner b{font-weight:600}
.banner .grow{flex:1;min-width:0}

.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:860px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.card-head h2{margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:end}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.net{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.01em;margin:6px 0 4px}
.net-note{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px}
.stat .v{font-weight:700;font-size:18px;margin-top:2px}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
@media (max-width:420px){.stat .v{font-size:15px}.stat{padding:10px}}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.compo{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:14px;gap:2px}
.compo span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .main-t{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.bank-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.bank-group{padding-top:6px}
.bank-group + .bank-group{margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.bank-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.bank-h .t{font-weight:700;flex:1}
.acc{display:flex;justify-content:space-between;gap:10px;padding:6px 0 6px 44px;font-size:14px}
.acc .n{color:var(--muted);min-width:0;overflow-wrap:anywhere}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter > span{display:block;height:100%;border-radius:5px;background:var(--accent)}

.ccard{display:grid;gap:12px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative}
.ccard-top{display:flex;gap:12px;align-items:center}
.ccard-top .t{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.ccard-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ccard-nums .l{font-size:12px;color:var(--muted)}
.ccard-nums .v{font-weight:700}
.due{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px}
.cards-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}

.field{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--fg);width:100%;min-width:0}
.field textarea{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.inline-form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.goals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.goal .t{font-weight:700;overflow-wrap:anywhere}
.goal .s{font-size:13px;color:var(--muted)}
.goal .fc{grid-column:1/-1;font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ring text{font-family:var(--font-display);font-weight:600}

.chart{width:100%;min-width:460px;height:auto;display:block}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px}
.best{display:grid;gap:8px;margin-top:12px}
.best-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.best-item:first-child{background:var(--accent-soft)}
.best-item .pct{font-family:var(--font-display);font-weight:600;font-size:18px;min-width:56px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 6px 5px 10px;border-radius:999px;background:var(--surface-2)}
.chip b{font-weight:700}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.chip button:hover{background:var(--line);color:var(--fg)}

.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;text-align:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.view[hidden]{display:none!important}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;background:var(--bad-soft);border-radius:10px;padding:8px 10px}

/* мобильная панель вкладок */
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab[aria-current="page"]{background:transparent}
  .main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .sync .when{display:none}
  .top-in{padding-block:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>


<header class="top">
  <div class="top-in">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><circle cx="18.5" cy="12" r="6" fill="#F6BE42"/><path d="M6 15.5h20v9.2L16 28.6 6 24.7z" fill="var(--surface)"/><path d="M8 18.2h16M8.6 18.2v5.6l7.4 2.9 7.4-2.9v-5.6" fill="none" stroke="var(--accent)" stroke-width="1.1" stroke-dasharray="1.8 1.4"/></svg><div>Карман<small id="modeLabel">Пример данных</small></div></div>

      <a class="tab" href="#cards" data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Кредитки</a>

      <a class="tab" href="#goals" data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Цели</a>

    </nav>
    <div class="sync"><span class="when num" id="syncWhen"></span>
      <button class="icon-btn" id="syncBtn" title="Обновить данные" aria-label="Обновить данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>

<main class="main">
  <div id="banners"></div>
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-cards" hidden></section>
  <section class="view" id="v-cashback" hidden></section>
  <section class="view" id="v-goals" hidden></section>
  <section class="view" id="v-setup" hidden></section>
</main>

<script>
(function(){
"use strict";

/* ---------- хранилище в браузере ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const K = { token:"kazna_token", cache:"kazna_cache", settings:"kazna_settings", synced:"kazna_synced" };
const API = "https://api.zenmoney.ru/v8/diff/";
const VIEWS = ["overview","cards","cashback","goals","setup"];

/* ---------- утилиты ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ym = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const parseD = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const daysBetween = (a,b) => Math.round((parseD(ymd(b)) - parseD(ymd(a))) / 864e5);
const uid = () => Math.random().toString(36).slice(2,10);
const NF = new Intl.NumberFormat("ru-RU", {maximumFractionDigits:0});
let CUR = "₽";
const money = (n, sign) => (sign && n > 0 ? "+" : "") + (n < 0 ? "−" : "") + NF.format(Math.abs(Math.round(n))) + " " + CUR;
const shortMoney = n => { const a = Math.abs(n); if(a >= 1e6) return (n/1e6).toFixed(1).replace(".",",")+" млн"; if(a >= 1e3) return Math.round(n/1e3)+" тыс"; return String(Math.round(n)); };
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_N = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const dLong = d => d.getDate()+" "+MONTHS_G[d.getMonth()];
const mLabel = key => { const [y,m] = key.split("-").map(Number); return MONTHS[m-1]; };
const mFull = d => MONTHS_N[d.getMonth()]+" "+d.getFullYear();
const plural = (n, a, b, c) => { n = Math.abs(n)%100; const n1 = n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; };

/* ---------- банки ---------- */
const BANK_RULES = [
  [/сбер|sber/i, "Сбер"], [/тиньк|т-банк|т банк|tbank|tinkoff/i, "Т-Банк"], [/альфа|alfa/i, "Альфа-Банк"],
  [/ozon|озон/i, "Ozon Банк"], [/wildberr|вайлдб|вб банк|wb bank|wb банк/i, "ВБ Банк"], [/яндекс|yandex/i, "Яндекс Банк"],
  [/втб|vtb/i, "ВТБ"], [/мкб|московский кредитный/i, "МКБ"], [/газпромб/i, "Газпромбанк"]
];
const normBank = t => { for(const [re,n] of BANK_RULES) if(re.test(t||"")) return n; return t || "Другое"; };
const BANK_ORDER = ["Сбер","Т-Банк","Альфа-Банк","Ozon Банк","ВБ Банк","Яндекс Банк"];
const bankColorCache = {};
function bankColor(name){
  if(bankColorCache[name]) return bankColorCache[name];
  let i = BANK_ORDER.indexOf(name);
  if(i < 0){ let h = 0; for(const ch of name) h = (h*31 + ch.charCodeAt(0)) >>> 0; i = 6 + (h % 2); }
  return bankColorCache[name] = "var(--b"+(i+1)+")";
}
const bankAbbr = n => ({"Сбер":"СБ","Т-Банк":"Т","Альфа-Банк":"А","Ozon Банк":"OZ","ВБ Банк":"ВБ","Яндекс Банк":"Я","Наличные":"₽"}[n] || n.replace(/[^A-Za-zА-Яа-яЁё]/g,"").slice(0,2).toUpperCase());
const bankMark = n => '<span class="bank-mark" style="background:'+bankColor(n)+'">'+esc(bankAbbr(n))+'</span>';

const CASHBACK_RE = /(к[эе]ш\s?-?\s?б[эе]к|cash\s?-?back|начислен\w*\s+(бонус|балл)|вознаграждени|возврат\s+(бонус|балл))/i;

/* ---------- API Дзен-мани ---------- */
class SyncError extends Error{ constructor(kind, status){ super(kind); this.kind = kind; this.status = status; } }
async function zmDiff(token, serverTimestamp){
  let r;
  try{
    r = await fetch(API, { method:"POST", headers:{ "Authorization":"Bearer "+token, "Content-Type":"application/json" },
      body: JSON.stringify({ currentClientTimestamp: Math.floor(Date.now()/1000), serverTimestamp: serverTimestamp || 0 }) });
  }catch(e){ throw new SyncError("network"); }
  if(r.status === 401 || r.status === 403) throw new SyncError("auth", r.status);
  if(!r.ok) throw new SyncError("http", r.status);
  return r.json();
}
const ENTITIES = ["instrument","company","user","account","tag","merchant","transaction"];
function mergeDiff(base, diff){
  const out = Object.assign({}, base || {});
  for(const e of ENTITIES){
    const map = new Map((out[e] || []).map(x => [String(x.id), x]));
    for(const x of (diff[e] || [])) map.set(String(x.id), x);
    out[e] = Array.from(map.values());
  }
  for(const d of (diff.deletion || [])){
    if(out[d.object]) out[d.object] = out[d.object].filter(x => String(x.id) !== String(d.id));
  }
  out.serverTimestamp = diff.serverTimestamp || out.serverTimestamp || 0;
  return out;
}
function trimData(d){
  const cutoff = ymd(new Date(Date.now() - 430*864e5));
  return {
    serverTimestamp: d.serverTimestamp,
    instrument: (d.instrument||[]).map(i => ({id:i.id, shortTitle:i.shortTitle, symbol:i.symbol, rate:i.rate})),
    company: (d.company||[]).map(c => ({id:c.id, title:c.title})),
    user: (d.user||[]).map(u => ({id:u.id, currency:u.currency})),
    account: (d.account||[]).map(a => ({id:a.id, title:a.title, type:a.type, instrument:a.instrument, company:a.company, balance:a.balance,
      creditLimit:a.creditLimit, savings:a.savings, inBalance:a.inBalance, archive:a.archive, percent:a.percent})),
    tag: (d.tag||[]).map(t => ({id:t.id, title:t.title, parent:t.parent})),
    merchant: (d.merchant||[]).map(m => ({id:m.id, title:m.title})),
    transaction: (d.transaction||[]).filter(t => !t.deleted && t.date >= cutoff).map(t => ({id:t.id, date:t.date, income:t.income, outcome:t.outcome,
      incomeAccount:t.incomeAccount, outcomeAccount:t.outcomeAccount, incomeInstrument:t.incomeInstrument, outcomeInstrument:t.outcomeInstrument,
      tag:t.tag, payee:t.payee, originalPayee:t.originalPayee, comment:t.comment, merchant:t.merchant}))
  };
}

/* ---------- модель: из сырых данных в цифры дашборда ---------- */
function buildModel(d, st){
  const today = new Date();
  const user = (d.user || [])[0] || {};
  const inst = new Map((d.instrument || []).map(i => [i.id, i]));
  const cur = inst.get(user.currency) || {rate:1, symbol:"₽"};
  CUR = cur.symbol || cur.shortTitle || "₽";
  const conv = (amt, iid) => { const i = inst.get(iid); if(!i || !cur.rate || !i.rate) return amt || 0; return (amt || 0) * i.rate / cur.rate; };
  const comp = new Map((d.company || []).map(c => [c.id, c]));
  const tags = new Map((d.tag || []).map(t => [t.id, t]));
  const merch = new Map((d.merchant || []).map(m => [m.id, m]));
  const rawAcc = new Map((d.account || []).map(a => [a.id, a]));

  const accounts = (d.account || []).filter(a => !a.archive && a.type !== "debt").map(a => {
    const bank = a.type === "cash" ? "Наличные" : normBank((comp.get(a.company) || {}).title || "");
    const bal = conv(a.balance, a.instrument);
    const limit = conv(a.creditLimit || 0, a.instrument);
    const isLoan = a.type === "loan";
    const isCard = a.type === "ccard" && limit > 0;
    const savingsOverride = st.savingsAccs ? st.savingsAccs[a.id] : undefined;
    const isSavings = !isLoan && !isCard && (savingsOverride !== undefined ? savingsOverride : (!!a.savings || a.type === "deposit"));
    const hiddenOverride = st.hiddenAccs ? st.hiddenAccs[a.id] : undefined;
    const included = hiddenOverride !== undefined ? !hiddenOverride : a.inBalance !== false;
    let own = 0, debt = 0;
    if(isCard){ own = Math.max(bal, 0); debt = Math.max(-bal, 0); }
    else if(isLoan){ debt = Math.max(-bal, 0); }
    else { if(bal >= 0) own = bal; else debt = -bal; }
    return { id:a.id, title:a.title, bank, type:a.type, bal, limit, isLoan, isCard, isSavings, included, own, debt, percent:a.percent };
  });

  const inc = accounts.filter(a => a.included);
  const totals = { money:0, savings:0, debt:0, cardDebt:0, loanDebt:0 };
  for(const a of inc){
    if(a.isSavings) totals.savings += a.own; else totals.money += a.own;
    totals.debt += a.debt;
    if(a.isCard) totals.cardDebt += a.debt; else if(a.isLoan) totals.loanDebt += a.debt;
  }
  totals.net = totals.money + totals.savings - totals.debt;

  // банки
  const banks = new Map();
  for(const a of inc){
    if(!banks.has(a.bank)) banks.set(a.bank, {name:a.bank, accounts:[], total:0});
    const b = banks.get(a.bank); b.accounts.push(a); b.total += a.own - a.debt;
  }
  const bankList = Array.from(banks.values()).sort((x,y) => {
    const ix = BANK_ORDER.indexOf(x.name), iy = BANK_ORDER.indexOf(y.name);
    return (ix<0?99:ix) - (iy<0?99:iy) || y.total - x.total;
  });

  // операции
  const nowKey = ym(today);
  const months = []; for(let i = 5; i >= 0; i--){ months.push(ym(new Date(today.getFullYear(), today.getMonth()-i, 1))); }
  const cbByMonthBank = {}; months.forEach(m => cbByMonthBank[m] = {});
  const cbYear = {}; let cbYearTotal = 0; const cbList = [];
  const spendCats = {}; let monthIncome = 0, monthSpend = 0;
  const flow90 = {}; const since90 = ymd(new Date(Date.now() - 90*864e5));
  const year = String(today.getFullYear());
  const tagTitle = t => { if(!t) return "Без категории"; const tg = tags.get(t); if(!tg) return "Без категории"; if(tg.parent && tags.get(tg.parent)) return tags.get(tg.parent).title; return tg.title; };
  const bankOf = id => { const a = rawAcc.get(id); if(!a) return "Другое"; return a.type === "cash" ? "Наличные" : normBank((comp.get(a.company) || {}).title || ""); };

  for(const t of (d.transaction || [])){
    if(t.deleted) continue;
    const mk = t.date.slice(0,7);
    if(t.date >= since90){
      if(t.income > 0) flow90[t.incomeAccount] = (flow90[t.incomeAccount] || 0) + conv(t.income, t.incomeInstrument);
      if(t.outcome > 0) flow90[t.outcomeAccount] = (flow90[t.outcomeAccount] || 0) - conv(t.outcome, t.outcomeInstrument);
    }
    const same = t.incomeAccount === t.outcomeAccount;
    if(same && t.income > 0 && !(t.outcome > 0)){
      const text = [t.payee, t.originalPayee, t.comment, (merch.get(t.merchant)||{}).title, (t.tag||[]).map(x => (tags.get(x)||{}).title).join(" ")].join(" ");
      const v = conv(t.income, t.incomeInstrument);
      if(CASHBACK_RE.test(text)){
        const bank = bankOf(t.incomeAccount);
        if(cbByMonthBank[mk]) cbByMonthBank[mk][bank] = (cbByMonthBank[mk][bank] || 0) + v;
        if(t.date.slice(0,4) === year){ cbYear[bank] = (cbYear[bank] || 0) + v; cbYearTotal += v; }
        cbList.push({date:t.date, bank, v, text:t.payee || t.comment || "Кешбэк"});
      } else if(mk === nowKey) monthIncome += v;
    } else if(same && t.outcome > 0 && !(t.income > 0)){
      if(mk === nowKey){
        const v = conv(t.outcome, t.outcomeInstrument);
        monthSpend += v;
        const c = tagTitle((t.tag || [])[0]);
        spendCats[c] = (spendCats[c] || 0) + v;
      }
    }
  }
  cbList.sort((a,b) => b.date.localeCompare(a.date));
  const cbMonthTotal = Object.values(cbByMonthBank[nowKey] || {}).reduce((s,v) => s+v, 0);
  const topCats = Object.entries(spendCats).sort((a,b) => b[1]-a[1]);

  // кредитки
  const cards = accounts.filter(a => a.isCard).map(a => {
    const cfg = (st.cards || {})[a.id] || {};
    let dueDate = null;
    if(cfg.graceEnd){ dueDate = parseD(cfg.graceEnd); }
    else if(cfg.dueDay){
      const dd = Math.min(28, Math.max(1, +cfg.dueDay));
      dueDate = new Date(today.getFullYear(), today.getMonth(), dd);
      if(daysBetween(today, dueDate) < 0) dueDate = new Date(today.getFullYear(), today.getMonth()+1, dd);
    }
    const days = dueDate ? daysBetween(today, dueDate) : null;
    let status = "muted", statusText = "Дата платежа не указана";
    if(a.debt < 1){ status = "good"; statusText = "Долга нет"; }
    else if(days === null){ status = "muted"; }
    else if(days < 0){ status = "bad"; statusText = "Срок прошёл " + dLong(dueDate); }
    else if(days <= 3){ status = "bad"; statusText = days === 0 ? "Платёж сегодня" : "Через " + days + " " + plural(days,"день","дня","дней"); }
    else if(days <= 10){ status = "warn"; statusText = "Через " + days + " " + plural(days,"день","дня","дней"); }
    else { status = "good"; statusText = "Через " + days + " " + plural(days,"день","дня","дней"); }
    return Object.assign({}, a, { cfg, dueDate, days, status, statusText, util: a.limit ? a.debt / a.limit : 0, available: a.limit - a.debt + a.own });
  }).sort((x,y) => (x.debt < 1) - (y.debt < 1) || (x.days == null) - (y.days == null) || (x.days||0) - (y.days||0));

  const loans = accounts.filter(a => a.isLoan && a.included);

  // цели
  const accById = new Map(accounts.map(a => [a.id, a]));
  const goals = (st.goals || []).map(g => {
    const linked = (g.accounts || []).filter(id => accById.has(id));
    const current = linked.length ? linked.reduce((s,id) => s + accById.get(id).bal, 0) : (+g.manual || 0);
    const target = +g.target || 0;
    const remaining = Math.max(target - current, 0);
    const pct = target > 0 ? Math.min(current / target, 1) : 0;
    const pace = linked.length ? linked.reduce((s,id) => s + (flow90[id] || 0), 0) / 3 : (+g.monthly || null);
    let eta = null; if(remaining > 0 && pace > 0){ eta = new Date(today.getFullYear(), today.getMonth() + Math.ceil(remaining / pace), 1); }
    let monthsLeft = null, need = null;
    if(g.deadline){ const dl = parseD(g.deadline); monthsLeft = (dl.getFullYear() - today.getFullYear())*12 + dl.getMonth() - today.getMonth(); if(monthsLeft >= 1) need = remaining / monthsLeft; }
    let status = "muted";
    if(remaining <= 0) status = "good";
    else if(g.deadline && eta) status = eta <= parseD(g.deadline) ? "good" : "warn";
    else if(g.deadline && !(pace > 0)) status = "warn";
    return Object.assign({}, g, { linked, current, target, remaining, pct, pace, eta, monthsLeft, need, status });
  });

  return { today, totals, bankList, accounts, cards, loans, months, cbByMonthBank, cbYear, cbYearTotal, cbMonthTotal, cbList, monthIncome, monthSpend, topCats, goals, nowKey };
}

/* ---------- состояние ---------- */
const S = {
  token: LS.get(K.token, ""),
  data: null, settings: null, model: null, demo: true,
  syncing: false, error: null, synced: LS.get(K.synced, null),
  editGoal: null, confirm: null, view: "overview", cbQuery: ""
};
function loadState(){
  if(S.token){
    S.demo = false;
    S.data = LS.get(K.cache, null);
    S.settings = Object.assign({cards:{}, goals:[], cbCats:[], savingsAccs:{}, hiddenAccs:{}}, LS.get(K.settings, {}));
  } else {
    S.demo = true; S.data = demoData(); S.settings = demoSettings(); S.synced = Date.now();
  }
}
function saveSettings(){ if(!S.demo) LS.set(K.settings, S.settings); recompute(); }
function recompute(){ S.model = S.data ? buildModel(S.data, S.settings) : null; render(); }

async function sync(full){
  if(S.demo || !S.token || S.syncing) return;
  S.syncing = true; S.error = null; renderChrome();
  try{
    const base = full ? null : S.data;
    const diff = await zmDiff(S.token, base ? base.serverTimestamp : 0);
    S.data = trimData(mergeDiff(base, diff));
    S.synced = Date.now();
    if(!LS.set(K.cache, S.data)){ /* данные не влезли в хранилище — работаем из памяти */ }
    LS.set(K.synced, S.synced);
  }catch(e){
    S.error = e.kind || "unknown";
    if(e.status) S.errorStatus = e.status;
  }
  S.syncing = false; recompute();
}

/* ---------- отрисовка ---------- */
function renderChrome(){
  $("#modeLabel").textContent = S.demo ? "Пример данных" : "Данные из Дзен-мани";
  const w = $("#syncWhen");
  if(S.syncing) w.textContent = "Обновляю…";
  else if(S.synced){ const d = new Date(S.synced); w.textContent = (ymd(d) === ymd(new Date()) ? "сегодня " : dLong(d)+", ") + pad(d.getHours())+":"+pad(d.getMinutes()); }
  else w.textContent = "";
  const b = $("#syncBtn"); b.classList.toggle("spin", S.syncing); b.disabled = S.demo || S.syncing; b.hidden = S.demo;
  for(const a of document.querySelectorAll(".tab")) a.setAttribute("aria-current", a.dataset.v === S.view ? "page" : "false");
  for(const v of VIEWS) $("#v-"+v).hidden = v !== S.view;

  let html = "";
  if(S.demo) html += '<div class="banner"><div class="grow"><b>Это пример с выдуманными цифрами.</b> Ваши счета появятся после подключения Дзен-мани.</div><a class="btn small primary" href="#setup">Подключить</a></div>';
  if(S.error){
    const msg = {
      network: "Не получилось связаться с Дзен-мани. Если дашборд открыт внутри Claude, так и должно быть: Claude не пускает страницы на сторонние сайты. Откройте свою копию дашборда. Если это ваша копия, проверьте интернет.",

}

  renderChrome();

  renderOverview(M); renderCards(M); renderCashback(M); renderGoals(M); renderSetup();

function ring(pct, size, status){
  const r = size/2 - 7, c = 2*Math.PI*r, off = c*(1-pct);
  const col = status === "good" ? "var(--good)" : status === "warn" ? "var(--warn)" : "var(--accent)";
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+Math.round(pct*100)+'%">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="9"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="'+(size/5.2)+'" fill="var(--fg)">'+Math.round(pct*100)+'%</text></svg>';
}

function goalForecast(g){
  if(g.remaining <= 0) return "<b>Цель достигнута.</b>";
  const parts = [];
  if(g.pace > 0) parts.push("Откладываете в среднем <b class=\"num\">"+money(g.pace)+"</b> в месяц"+(g.eta ? ", при таком темпе соберёте к <b>"+mFull(g.eta)+"</b>." : "."));
  else if(g.linked.length) parts.push("За последние 3 месяца на эти счета ничего не прибавилось.");
  else parts.push("Укажите, сколько откладываете в месяц, чтобы увидеть прогноз.");
  if(g.need != null) parts.push("Чтобы успеть к сроку, нужно <b class=\"num\">"+money(g.need)+"</b> в месяц.");
  else if(g.deadline && g.monthsLeft != null && g.monthsLeft < 1) parts.push("Срок цели уже наступил.");
  return parts.join(" ");
}

function cashbackChart(M){
  const W = 640, H = 230, L = 46, R = 10, Tp = 12, B = 28;
  const banks = new Set(); M.months.forEach(m => Object.keys(M.cbByMonthBank[m]).forEach(b => banks.add(b)));
  const order = Array.from(banks).sort((a,b) => { const ia = BANK_ORDER.indexOf(a), ib = BANK_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  const totals = M.months.map(m => Object.values(M.cbByMonthBank[m]).reduce((s,v)=>s+v,0));
  const maxV = Math.max(...totals, 1);
  const raw = maxV / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const tickStep = [1,2,2.5,5,10].map(k => k*mag).find(s => s >= raw);
  const ticks = Math.ceil(maxV / tickStep); const top = tickStep * ticks;
  const y = v => Tp + (H - Tp - B) * (1 - v/top);
  const bw = (W - L - R) / M.months.length; const barW = Math.min(46, bw*0.56);
  let g = "";
  for(let i = 0; i <= ticks; i++){ const v = tickStep*i; g += '<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+shortMoney(v)+'</text>'; }
  M.months.forEach((m, i) => {
    const x = L + bw*i + (bw - barW)/2; let acc = 0;
    order.forEach(b => { const v = M.cbByMonthBank[m][b] || 0; if(!v) return; const y1 = y(acc), y2 = y(acc+v); g += '<rect x="'+x.toFixed(1)+'" y="'+y2.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(y1-y2-1,0.5).toFixed(1)+'" fill="'+bankColor(b)+'" rx="2"><title>'+esc(b)+': '+money(v)+'</title></rect>'; acc += v; });
    const isNow = m === M.nowKey;
    g += '<text x="'+(x+barW/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(isNow?' style="fill:var(--fg);font-weight:600"':'')+'>'+mLabel(m)+'</text>';
    if(totals[i] > 0) g += '<text x="'+(x+barW/2)+'" y="'+(y(totals[i])-5)+'" text-anchor="middle" style="fill:var(--fg)">'+shortMoney(totals[i])+'</text>';
  });
  return '<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кешбэк по месяцам">'+g+'</svg></div>'+
    '<div class="legend">'+order.map(b => '<span><span class="dot" style="background:'+bankColor(b)+'"></span>'+esc(b)+'</span>').join("")+'</div>';
}

function bestCards(q){
  const st = S.settings, m = ym(new Date());
  let cats = (st.cbCats || []).filter(c => c.month === m);
  if(!q) return [];
  const ql = q.toLowerCase().trim();
  const hits = cats.filter(c => c.cat.toLowerCase().includes(ql) || ql.includes(c.cat.toLowerCase()));
  const base = cats.filter(c => /всё остальное|все остальное|любые|все покупки/i.test(c.cat));
  return (hits.length ? hits.concat(base.filter(b => !hits.some(h => h.bank === b.bank))) : base).sort((a,b) => b.pct - a.pct);
}

    : '<div class="muted small">Под «'+esc(q)+'» ни одной категории на этот месяц. Платите картой с лучшим кешбэком на всё остальное.</div>';
}

function renderGoals(M){
  const eg = S.editGoal;
  const accs = M.accounts.filter(a => !a.isCard && !a.isLoan);
  const form = eg ? (() => {
    const g = eg.id ? (S.settings.goals || []).find(x => x.id === eg.id) || {} : {};
    const useAcc = eg.src ? eg.src === "acc" : (g.accounts && g.accounts.length) || (!eg.id);
    return '<div class="card c12"><h2>'+(eg.id ? "Изменить цель" : "Новая цель")+'</h2><form id="goalForm" style="display:grid;gap:14px;margin-top:10px">'+
      '<div class="inline-form"><label class="field">Название<input id="gf-name" required value="'+esc(g.name||"")+'" placeholder="Подушка безопасности"></label>'+
      '<label class="field">Сумма цели, '+esc(CUR)+'<input id="gf-target" type="number" min="1" required inputmode="numeric" value="'+esc(g.target||"")+'" placeholder="300000"></label>'+
      '<label class="field">К какому сроку<input id="gf-deadline" type="date" value="'+esc(g.deadline||"")+'"></label></div>'+
      '<div class="actions"><label class="toggle"><input type="radio" name="gsrc" value="acc" '+(useAcc?"checked":"")+'> Считать по остатку счетов</label><label class="toggle"><input type="radio" name="gsrc" value="manual" '+(!useAcc?"checked":"")+'> Вести сумму вручную</label></div>'+
      (useAcc ? '<div><div class="muted small" style="margin-bottom:6px">Какие счета копят на эту цель</div><div style="display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))">'+
        accs.map(a => '<label class="toggle" style="white-space:normal;color:var(--fg)"><input type="checkbox" name="gacc" value="'+esc(a.id)+'" '+((g.accounts||[]).includes(a.id)?"checked":"")+'> '+esc(a.bank)+' · '+esc(a.title)+' <span class="muted num">'+money(a.bal)+'</span></label>').join("")+'</div></div>'
        : '<div class="inline-form"><label class="field">Уже накоплено, '+esc(CUR)+'<input id="gf-manual" type="number" min="0" inputmode="numeric" value="'+esc(g.manual||"")+'"></label><label class="field">Откладываю в месяц, '+esc(CUR)+'<input id="gf-monthly" type="number" min="0" inputmode="numeric" value="'+esc(g.monthly||"")+'"></label></div>')+
      '<div class="actions"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" id="gf-cancel">Отмена</button></div></form></div>';
  })() : "";

  $("#v-goals").innerHTML = '<div class="grid">'+
    '<div class="card c12"><div class="card-head"><div><h2>Цели по накоплениям</h2><p class="sub" style="margin:0">Прогресс считается по остаткам на выбранных счетах, прогноз по темпу за последние 3 месяца</p></div>'+
    (eg ? "" : '<button class="btn primary" id="addGoal">Новая цель</button>')+'</div></div>'+
    form+
    '<div class="c12 goals">'+(M.goals.length ? M.goals.map(g =>
      '<div class="goal">'+ring(g.pct, 92, g.status)+'<div style="min-width:0"><div class="t">'+esc(g.name)+'</div>'+
      '<div class="num" style="font-weight:700;font-size:17px;margin:2px 0">'+money(g.current)+' <span class="muted" style="font-weight:500;font-size:14px">из '+money(g.target)+'</span></div>'+
      '<div class="s">'+(g.remaining > 0 ? 'Осталось <span class="num">'+money(g.remaining)+'</span>' : 'Собрано')+(g.deadline ? ' · срок '+dLong(parseD(g.deadline))+' '+parseD(g.deadline).getFullYear() : '')+'</div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn small" data-editgoal="'+esc(g.id)+'">Изменить</button>'+
      (S.confirm === "goal:"+g.id ? '' : '<button class="btn small danger" data-askdel="'+esc(g.id)+'">Удалить</button>')+'</div></div>'+
      (S.confirm === "goal:"+g.id ? '<div class="confirm" style="grid-column:1/-1"><span style="flex:1">Удалить цель «'+esc(g.name)+'»? Деньги на счетах не изменятся.</span><button class="btn small danger" data-delgoal="'+esc(g.id)+'">Удалить</button><button class="btn small" data-cancel="1">Оставить</button></div>' : '')+
      '<div class="fc"><span class="pill '+g.status+'" style="margin-right:6px">'+(g.status==="good"?(g.remaining>0?"Успеваете":"Готово"):g.status==="warn"?"Не успеваете":"Без срока")+'</span>'+goalForecast(g)+'</div></div>'
    ).join("") : (eg ? "" : '<div class="empty">Целей пока нет. Нажмите «Новая цель» и выберите счета, на которых копите.</div>'))+'</div>'+
  '</div>';
}

function renderSetup(){
  const M = S.model;
  const inClaude = /claude|anthropic/i.test(location.hostname);
  const accRows = M ? M.accounts.map(a => '<div class="row" style="flex-wrap:wrap">'+bankMark(a.bank)+'<div class="main-t"><div class="t">'+esc(a.title)+'</div><div class="s num">'+esc(a.bank)+' · '+money(a.own - a.debt)+'</div></div>'+
    '<div class="actions">'+(!a.isCard && !a.isLoan ? '<label class="toggle"><input type="checkbox" data-sav="'+esc(a.id)+'" '+(a.isSavings?"checked":"")+'> Накопления</label>' : '')+
    '<label class="toggle"><input type="checkbox" data-hide="'+esc(a.id)+'" '+(!a.included?"checked":"")+'> Не учитывать</label></div></div>').join("") : "";

  $("#v-setup").innerHTML = '<div class="grid">'+
    '<div class="card c7"><h2>Подключение к Дзен-мани</h2>'+
    (S.demo ?
      '<p class="sub">Дашборд берёт данные из Дзен-мани, а тот сам забирает операции из банков. Токен хранится только в этом браузере.</p>'+
      (inClaude ? '<div class="banner warn" style="margin-bottom:12px"><div class="grow">В окне Claude подключение не сработает: здесь страницам закрыт выход на сторонние сайты. Вставляйте токен в своей копии дашборда.</div></div>' : '')+
      '<ol class="steps"><li>Установите Дзен-мани и подключите в нём свои банки.</li><li>Откройте <a href="https://zerro.app/token" target="_blank" rel="noopener">zerro.app/token</a>, войдите через аккаунт Дзен-мани и скопируйте токен.</li><li>Вставьте токен сюда и нажмите «Подключить».</li></ol>'+
      '<form id="tokenForm" class="search" style="margin-top:14px"><input id="tokenInput" type="password" autocomplete="off" placeholder="Токен Дзен-мани" required><button class="btn primary" type="submit">Подключить</button></form>'+
      '<p class="muted small" style="margin:10px 0 0">Токен даёт доступ к вашим данным в Дзен-мани. Никому его не пересылайте. Дашборд только читает данные и ничего в Дзен-мани не меняет.</p>'
    :
      '<p class="sub">Подключено. Данные обновляются при каждом открытии и каждые 30 минут, пока страница открыта.</p>'+
      '<div class="actions"><button class="btn" id="fullSync">Загрузить всё заново</button>'+
      (S.confirm === "logout" ? '<span class="confirm" style="flex:1 1 100%"><span style="flex:1">Отключить? Токен и сохранённые данные удалятся из этого браузера, настройки целей останутся.</span><button class="btn small danger" id="logoutYes">Отключить</button><button class="btn small" data-cancel="1">Отмена</button></span>' : '<button class="btn danger" id="logout">Отключить</button>')+'</div>'+
      '<p class="muted small" style="margin:12px 0 0">Свежесть данных зависит от того, когда Дзен-мани последний раз синхронизировался с банками. Если цифры отстают, откройте приложение Дзен-мани на телефоне.</p>'
    )+'</div>'+

    '<div class="card c5"><h2>На экран «Домой» на iPhone</h2><ol class="steps"><li>Откройте свою копию дашборда в Safari.</li><li>Нажмите «Поделиться», затем «На экран Домой».</li><li>Дашборд откроется во весь экран, как приложение.</li></ol></div>'+

    (M ? '<div class="card c12"><h2>Счета</h2><p class="sub">Отметьте, какие счета считать накоплениями, и уберите из подсчётов те, что не нужны</p><div class="rows">'+accRows+'</div></div>' : '')+

    '<div class="card c12"><h2>Перенос настроек между устройствами</h2><p class="sub">Цели, даты платежей и категории кешбэка хранятся в каждом браузере отдельно. Скопируйте код на ПК и вставьте его на iPhone, или наоборот. Токена в коде нет.</p>'+
      '<div class="inline-form" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:start">'+
      '<div style="display:grid;gap:8px"><label class="field">Код настроек этого устройства<textarea id="expCode" readonly>'+esc(S.demo ? "" : JSON.stringify(S.settings))+'</textarea></label><button class="btn" id="copyExp" '+(S.demo?"disabled":"")+'>Скопировать код</button></div>'+
      '<div style="display:grid;gap:8px"><label class="field">Вставьте код с другого устройства<textarea id="impCode" placeholder="{&quot;goals&quot;:…}"></textarea></label><button class="btn" id="doImp" '+(S.demo?"disabled":"")+'>Загрузить настройки</button><div id="impMsg" class="small muted"></div></div>'+
      '</div>'+(S.demo ? '<p class="muted small" style="margin:10px 0 0">Перенос заработает после подключения Дзен-мани.</p>' : '')+
    '</div>'+
  '</div>';
}

/* ---------- обработчики ---------- */
function setView(v){ S.view = VIEWS.includes(v) ? v : "overview"; S.confirm = null; renderChrome(); window.scrollTo(0,0); }
window.addEventListener("hashchange", () => setView(location.hash.slice(1)));

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if(!t) return;
  const st = S.settings;
  if(t.id === "syncBtn") sync(false);
  else if(t.id === "fullSync") sync(true);
  else if(t.id === "logout"){ S.confirm = "logout"; renderSetup(); }
  else if(t.id === "logoutYes"){ LS.del(K.token); LS.del(K.cache); LS.del(K.synced); S.token = ""; S.confirm = null; S.error = null; loadState(); recompute(); }
  else if(t.dataset.cancel){ S.confirm = null; render(); }
  else if(t.id === "addGoal"){ S.editGoal = {id:null}; renderGoals(S.model); }
  else if(t.id === "gf-cancel"){ S.editGoal = null; renderGoals(S.model); }
  else if(t.dataset.editgoal){ S.editGoal = {id:t.dataset.editgoal}; renderGoals(S.model); window.scrollTo(0,0); }
  else if(t.dataset.askdel){ S.confirm = "goal:"+t.dataset.askdel; renderGoals(S.model); }
  else if(t.dataset.delgoal){ st.goals = st.goals.filter(g => g.id !== t.dataset.delgoal); S.confirm = null; saveSettings(); }
  else if(t.dataset.delcat){ st.cbCats = st.cbCats.filter(c => c.id !== t.dataset.delcat); saveSettings(); }
  else if(t.id === "copyCats"){
    const m = ym(new Date()); const prev = st.cbCats.reduce((mx,c) => c.month > mx ? c.month : mx, "");
    st.cbCats = st.cbCats.filter(c => c.month === prev).map(c => Object.assign({}, c, {id:uid(), month:m})); saveSettings();
  }
  else if(t.id === "copyExp"){
    const ta = $("#expCode"); const txt = ta.value;
    navigator.clipboard.writeText(txt).then(() => { t.textContent = "Скопировано"; }, () => { ta.focus(); ta.select(); t.textContent = "Выделено, скопируйте вручную"; });
  }
  else if(t.id === "doImp"){
    const msg = $("#impMsg");
    try{
      const v = JSON.parse($("#impCode").value);
      if(typeof v !== "object" || !v) throw 0;
      S.settings = Object.assign({cards:{}, goals:[], cbCats:[], savingsAccs:{}, hiddenAccs:{}}, {cards:v.cards, goals:v.goals, cbCats:v.cbCats, savingsAccs:v.savingsAccs, hiddenAccs:v.hiddenAccs});
      for(const k of ["cards","savingsAccs","hiddenAccs"]) if(typeof S.settings[k] !== "object" || !S.settings[k]) S.settings[k] = {};
      for(const k of ["goals","cbCats"]) if(!Array.isArray(S.settings[k])) S.settings[k] = [];
      saveSettings(); $("#impMsg").textContent = "Настройки загружены.";
    }catch(err){ msg.textContent = "Код не распознан. Скопируйте его целиком, от первой до последней фигурной скобки."; }
  }
});

document.addEventListener("change", e => {
  const t = e.target; const st = S.settings;
  if(t.dataset.card){
    const id = t.dataset.card; st.cards[id] = Object.assign({}, st.cards[id]);
    if(t.dataset.k === "dueDay"){ const v = parseInt(t.value,10); if(v >= 1 && v <= 31){ st.cards[id].dueDay = v; delete st.cards[id].graceEnd; } else delete st.cards[id].dueDay; }
    else { if(t.value){ st.cards[id].graceEnd = t.value; delete st.cards[id].dueDay; } else delete st.cards[id].graceEnd; }
    saveSettings();
  }
  else if(t.dataset.sav){ st.savingsAccs[t.dataset.sav] = t.checked; saveSettings(); }
  else if(t.dataset.hide){ st.hiddenAccs[t.dataset.hide] = t.checked; saveSettings(); }
  else if(t.name === "gsrc"){ S.editGoal = Object.assign({}, S.editGoal, {src:t.value}); keepGoalDraft(); renderGoals(S.model); restoreGoalDraft(); }
});
let goalDraft = null;
function keepGoalDraft(){ goalDraft = { name:$("#gf-name").value, target:$("#gf-target").value, deadline:$("#gf-deadline").value }; }
function restoreGoalDraft(){ if(!goalDraft) return; $("#gf-name").value = goalDraft.name; $("#gf-target").value = goalDraft.target; $("#gf-deadline").value = goalDraft.deadline; goalDraft = null; }

document.addEventListener("input", e => { if(e.target.id === "cbq"){ S.cbQuery = e.target.value; renderBest(); } });

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target; const st = S.settings;
  if(f.id === "tokenForm"){
    const tok = $("#tokenInput").value.trim(); if(!tok) return;
    S.token = tok; LS.set(K.token, tok); S.demo = false; S.data = null; S.error = null;
    S.settings = Object.assign({cards:{}, goals:[], cbCats:[], savingsAccs:{}, hiddenAccs:{}}, LS.get(K.settings, {}));
    S.model = null; render(); sync(true).then(() => { if(S.error === "auth" || S.error === "network"){ /* токен остаётся, его можно заменить после отключения */ } });
  }
  else if(f.id === "catForm"){
    const cat = $("#cf-cat").value.trim(); const pct = parseFloat($("#cf-pct").value);
    if(!cat || !(pct >= 0)) return;
    st.cbCats = (st.cbCats || []).concat({id:uid(), bank:$("#cf-bank").value, cat, pct, month:ym(new Date())});
    saveSettings(); setTimeout(() => { const el = $("#cf-cat"); if(el) el.focus(); }, 0);
  }
  else if(f.id === "goalForm"){
    const src = (f.querySelector('input[name="gsrc"]:checked') || {}).value;
    const g = { id: (S.editGoal && S.editGoal.id) || uid(), name: $("#gf-name").value.trim(), target: +$("#gf-target").value, deadline: $("#gf-deadline").value || "" };
    if(src === "acc") g.accounts = Array.from(f.querySelectorAll('input[name="gacc"]:checked')).map(x => x.value);
    else { g.manual = +($("#gf-manual") || {}).value || 0; g.monthly = +($("#gf-monthly") || {}).value || 0; g.accounts = []; }
    const i = st.goals.findIndex(x => x.id === g.id);
    if(i >= 0) st.goals[i] = g; else st.goals.push(g);
    S.editGoal = null; saveSettings();
  }
});

/* ---------- запуск ---------- */
loadState();
S.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
recompute();
if(!S.demo){ sync(false); setInterval(() => { if(document.visibilityState === "visible") sync(false); }, 30*60*1000); }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && !S.demo && S.synced && Date.now() - S.synced > 10*60*1000) sync(false); });

// экспорт для проверки в тестах
window.__kazna = { buildModel, demoData, demoSettings, mergeDiff, trimData };
})();
</script>

</body></html>
